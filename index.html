<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d18">
  <meta name="description" content="NOVA 2.0 — a small, friendly hybrid AI companion.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>NOVA 2.0</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><div class="brand-orb">N</div><div><strong>NOVA</strong><span>PERSONAL AI · 2.0</span></div></div>
      <div class="header-actions"><button id="voice-toggle" class="voice-toggle" type="button" aria-pressed="false">VOICE OFF</button><div class="status"><i></i><span id="mode-label">OFFLINE BRAIN</span></div></div>
    </header>
    <section class="welcome" id="welcome">
      <div class="hero-orb"><span></span></div>
      <p class="eyebrow">YOUR LITTLE AI COMPANION</p>
      <h1>Hi, I'm NOVA.</h1>
      <p class="subhead">I'm here to listen, understand, and talk with you — one small reply at a time.</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="I'm not feeling good">I'm not feeling good</button>
        <button class="suggestion" data-prompt="Tell me something interesting">Tell me something interesting</button>
        <button class="suggestion" data-prompt="Can we talk?">Can we talk?</button>
      </div>
    </section>
    <section class="chat" id="chat" aria-live="polite" aria-label="Conversation"></section>
    <form class="composer" id="chat-form">
      <label class="sr-only" for="message">Write a message</label>
      <textarea id="message" rows="1" maxlength="1200" placeholder="Talk to NOVA..." autocomplete="off"></textarea>
      <button class="send" type="submit" aria-label="Send message"><span>↑</span></button>
    </form>
    <footer class="footer">
      <span id="connection-note">Private session · Not saved to a server</span>
      <button id="new-chat" type="button">New chat</button>
    </footer>
  </main>
  <script src="./config.js"></script>
  <script src="./brain.js"></script>
  <script src="./app.js"></script>
</body>
</html>
